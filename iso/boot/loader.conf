# /boot/loader.conf of the LumenBSD live media (iso/build.sh puts it there).
#
# Start: the kernel, then a small ramdisk (/lumen/ramdisk.ufs) whose init.sh
# copies the compressed live system into memory and switches to it
# (reboot -r). See iso/ramdisk/init.sh.

loader_brand="lumen"
loader_logo="lumen"
loader_menu_title="Welcome to LumenBSD"
loader_menu_multi_user_prompt="LumenBSD"
autoboot_delay="5"
kernels_autodetect="NO"

mfsroot_load="YES"
mfsroot_type="md_image"
mfsroot_name="/lumen/ramdisk.ufs"
vfs.root.mountfrom="ufs:/dev/md0"
# Wait for every disk and USB device before starting, so the media is found
# and USB messages do not run over the boot screen.
vfs.root_mount_always_wait="1"
vfs.mountroot.timeout="30"
init_path="/rescue/init"
init_shell="/rescue/sh"
init_script="/init.sh"

# The live system runs from a ZFS pool in memory; keep ZFS's own cache small.
zfs_load="YES"
vfs.zfs.arc_max="268435456"

# Address disks by their plain names (ada0, nda0...): the installer needs them.
kern.geom.label.disk_ident.enable="0"
kern.geom.label.gptid.enable="0"

# Laptop touchpads and pointing sticks as real touchpads.
hw.psm.synaptics_support="1"
hw.psm.elantech_support="1"
hw.psm.trackpoint_support="1"
# NVIDIA: the Wayland desktop needs kernel mode setting (read only when the
# live session loads nvidia-drm).
hw.nvidiadrm.modeset="1"
# Shared memory for the desktop (as stages/system.sh sets).
kern.ipc.shmseg="1024"
kern.ipc.shmmni="1024"
