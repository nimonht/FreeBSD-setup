# Written by FreeBSD-setup: /etc/rc.conf of the LumenBSD live system.
hostname="@HOSTNAME@"
ifconfig_DEFAULT="DHCP inet6 accept_rtadv"
background_dhclient="YES"
zfs_enable="YES"
dbus_enable="YES"
lumen_live_enable="YES"
lumenbsd_osrelease_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
sshd_enable="NO"
dumpdev="NO"
syslogd_flags="-ss"
clear_tmp_enable="YES"
devfs_system_ruleset="localrules"
