# Written by FreeBSD-setup: the LunaBSD live system (the same desktop
# settings as stages/system.sh and stages/audio.sh give an installation).
vfs.usermount=1
kern.coredump=0
kern.ipc.shm_allow_removed=1
net.local.stream.recvspace=65536
net.local.stream.sendspace=65536
kern.maxfiles=524288
kern.maxfilesperproc=262144
hw.snd.default_auto=1
