name: ISO

# Builds the LunaBSD live ISO in a FreeBSD virtual machine (KVM) and boots
# it once in QEMU. Run by hand (Actions > ISO > Run workflow), or by pushing
# a tag like v0.1: then the ISO is also published as a release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage xz-utils ovmf python3-pil

      - name: Build the ISO
        env:
          VM_MEM: "12288"
        run: sh iso/build-in-vm.sh

      - name: Boot the ISO (UEFI, as a DVD)
        run: sh tests/vm/run-live-test.sh iso/out/*.iso uefi

      - name: Boot the ISO (UEFI, as a USB stick)
        env:
          MEDIA: usb
          WORK: tests/vm/live-work-usb
        run: sh tests/vm/run-live-test.sh iso/out/*.iso uefi

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunabsd-iso
          path: |
            iso/out/
            tests/vm/live-work*/serial.log
            tests/vm/live-work*/screen.png
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" iso/out/* --title "LunaBSD $GITHUB_REF_NAME" \
            --notes "Write the ISO to a USB stick (Rufus in DD mode, balenaEtcher or dd) and start the computer from it. Check the download: sha256sum -c *.sha256"
