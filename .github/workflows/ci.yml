name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -s sh -S warning -e SC1090,SC1091,SC2034,SC2154,SC3043 \
            setup.sh install.sh bootstrap.sh lib/*.sh stages/*.sh files/bin/* \
            caelestia/build.sh tests/run.sh tests/config-test.sh tests/collect-fixture.sh tests/vm/run-iso-test.sh

      - name: Hardware detection tests (POSIX sh)
        run: sh tests/run.sh

      - name: Configuration tests (POSIX sh)
        run: sh tests/config-test.sh
