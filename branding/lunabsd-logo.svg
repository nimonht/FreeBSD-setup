<?xml version="1.0" encoding="UTF-8"?>
<!-- LunaBSD logo: a sun rising over a horizon. Original artwork for this
     project (not derived from the FreeBSD logo, which is a trademark of the
     FreeBSD Foundation). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.55" stop-color="#FF9F43"/>
      <stop offset="1" stop-color="#FF5E62"/>
    </linearGradient>
    <clipPath id="above">
      <rect x="0" y="0" width="256" height="166"/>
    </clipPath>
  </defs>
  <g fill="none" stroke="url(#sun)" stroke-width="12" stroke-linecap="round">
    <line x1="128" y1="22" x2="128" y2="44"/>
    <line x1="62" y1="50" x2="76" y2="66"/>
    <line x1="194" y1="50" x2="180" y2="66"/>
    <line x1="30" y1="108" x2="50" y2="114"/>
    <line x1="226" y1="108" x2="206" y2="114"/>
  </g>
  <circle cx="128" cy="166" r="72" fill="url(#sun)" clip-path="url(#above)"/>
  <g stroke="#FF7A59" stroke-width="10" stroke-linecap="round">
    <line x1="40" y1="186" x2="216" y2="186"/>
    <line x1="68" y1="208" x2="188" y2="208"/>
    <line x1="98" y1="230" x2="158" y2="230"/>
  </g>
</svg>
