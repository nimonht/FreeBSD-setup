# /etc/pf.conf - desktop firewall written by FreeBSD-setup.
# Blocks connections started from outside, allows everything this computer
# starts. Check: doas pfctl -sr   Turn off for a test: doas pfctl -d
# Reload after editing: doas service pf reload

set skip on lo0
set block-policy return
scrub in all

block in all
pass out all keep state

# IPv6 cannot work without neighbour discovery and router advertisements.
pass inet6 proto ipv6-icmp all
# Answer pings; useful when diagnosing a network.
pass in inet proto icmp all icmp-type { echoreq, unreach }
# Printer and device discovery on the local network (mDNS).
pass in proto udp to port 5353
# DHCPv6 answers.
pass in inet6 proto udp from port 547 to port 546

# Open a port for something you run, e.g. KDE Connect:
# pass in proto { tcp, udp } to port 1714:1764
