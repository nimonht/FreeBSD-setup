# Unattended install used by the VM tests: next to existing systems, FreeBSD
# starting first (DISK_SETUP=dualboot LIMINE_ENROLL=yes: a Limine that checks
# its menu file must be left alone and still start, with L in FreeBSD's menu).
INSTALL_DISK=vtbd1
INSTALL_MODE=alongside
SWAP_SIZE=2g
MIN_GB=10
HOSTNAME_NEW=fbsdtest
USERNAME=tester
USER_FULLNAME="Test User"
USER_PASSWORD=test123
WIZ_LANG=vi
KEYBOARD_LAYOUT=us
TIMEZONE=Asia/Ho_Chi_Minh
DESKTOP=none
INPUT_METHODS="vi"
INSTALL_APPS=no
INSTALL_PRINTING=yes
INSTALL_GAMING=no
FIREWALL=yes
AUTO_SNAPSHOTS=yes
RUN_FREEBSD_UPDATE=no
SKIP_FREEBSD_UPDATE=yes
BOOT_DEFAULT=freebsd
