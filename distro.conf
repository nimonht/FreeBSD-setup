# distro.conf - who this distribution is, in one place. Plain sh (KEY="value"),
# read by the ISO build (iso/build.sh), the installers, the live session and
# the branding stage. Renaming the distribution means editing this file (and
# the artwork in branding/), nothing else.

DISTRO_NAME="LunaBSD"
DISTRO_ID="lunabsd"            # lower case, no spaces: file names, os-release ID
DISTRO_VERSION="0.1"
DISTRO_CODENAME="Crescent"
DISTRO_TAGLINE="FreeBSD, ready for your desktop"
DISTRO_URL="https://github.com/nimonht/LunaBSD"
DISTRO_BUG_URL="https://github.com/nimonht/LunaBSD/issues"
DISTRO_DOCS_URL="https://github.com/nimonht/LunaBSD#readme"

# The FreeBSD release the live image and new installations are built on.
# 15.2 is due in December 2026: change this line, rebuild the ISO.
FREEBSD_RELEASE="15.1-RELEASE"

# Package branch of the live image ("latest": newest KDE Plasma, Hyprland,
# drivers). New installations choose their own (lib/defaults.conf).
LIVE_PKG_BRANCH="latest"

# Volume label of the ISO: the live system finds its media by it
# (/dev/iso9660/<label>), and the installer never offers that disk.
ISO_LABEL="LUNABSD"

# The account of the live session (no password) and its computer name.
LIVE_USER="luna"
LIVE_HOSTNAME="lunabsd-live"
