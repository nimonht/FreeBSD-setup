# Default answers for FreeBSD-setup. Plain sh syntax (KEY="value").
#
# You normally never edit this file: the setup wizard asks the questions and
# saves your answers in /usr/local/etc/freebsd-setup.conf, which overrides
# these defaults on every later run. For unattended installs, copy this file,
# change it, and run:  setup.sh --yes --config my.conf
#
# "auto" means: decide from the detected hardware.

# The everyday (non-root) user to set the desktop up for.
# Empty = the user who started setup.sh via doas/sudo/su.
TARGET_USER=""

# Desktop: kde (KDE Plasma, recommended), hyprland (Hyprland + Caelestia,
# advanced), both (pick at the login screen), none (console only), or auto
# (kde when the hardware can run it, otherwise none).
DESKTOP="auto"

# Build the Caelestia shell for Hyprland (only used with hyprland/both).
INSTALL_CAELESTIA="yes"
CAELESTIA_SHELL_REF="latest-tag"    # "latest-tag", a tag, a branch or a commit
CAELESTIA_CLI_REF="latest-tag"
CAELESTIA_DOTS_REF="main"

# Package branch: quarterly (stable), latest (newest), or auto
# (latest when Hyprland is selected - Caelestia needs it - else quarterly).
# A machine already on "latest" is never moved back to "quarterly".
PKG_BRANCH="auto"

# Login screen: sddm (graphical; used for KDE), ly (text-mode; light,
# default for Hyprland-only), none (log in on the console), or auto.
DISPLAY_MANAGER="auto"

# Graphics drivers. auto = install a driver for every detected GPU.
# GPU_DRIVERS can be narrowed to e.g. "intel" to install no driver for a
# hybrid laptop's NVIDIA card. Where that driver is already installed, also
# stop it loading: doas sysrc kld_list-="nvidia-modeset nvidia-drm"
GPU_DRIVERS="auto"
# NVIDIA driver branch: auto (from NVIDIA's own GPU list), current, 580,
# 470, 390, 340, 304, or none.
NVIDIA_BRANCH="auto"

# Optional parts (yes/no; auto decides from the hardware).
INSTALL_APPS="yes"          # browser, office, media, utilities
INSTALL_PRINTING="yes"      # printers and scanners (CUPS, SANE)
INSTALL_GAMING="auto"       # Steam (Linux client), Wine/Proton, MangoHud
INSTALL_DEVTOOLS="no"       # VS Code, compilers, build tools
FIREWALL="yes"              # block unsolicited incoming connections (pf)
AUTO_SNAPSHOTS="yes"        # rolling ZFS snapshots (ZFS installs only)

# Terminal style: how the terminal app (Konsole, foot) behaves and looks.
#   fish  suggestions as you type, colours, a git-aware prompt (like CachyOS)
#   zsh   the same idea in zsh, closer to bash for copy-pasted commands
#   bash  bash with colours, history search and completion
#   none  plain, as FreeBSD ships it
#   auto  fish with a desktop, none without one
# Your login shell is never changed: the style applies inside the terminal
# app, so a broken shell setup can never stop you from logging in.
# For yourself only: terminal-style off | on | greeting-off | greeting-on
TERMINAL_STYLE="auto"
TERMINAL_GREETING="yes"     # system summary (fastfetch) when a terminal shell starts

# Extra input methods (fcitx5), space separated:
#   vi (Vietnamese), zh-cn (Chinese pinyin), zh-tw (Chinese zhuyin),
#   ja (Japanese), ko (Korean), m17n (Thai, Indic and many more)
INPUT_METHODS=""

# Keyboard layout for the desktop and login screen (XKB name: us, gb, de,
# fr, es, it, pt, br, ru, jp, ...). Empty = keep what the system has.
KEYBOARD_LAYOUT=""

# Language of the desktop (a locale name). Empty = keep the current one.
LOCALE=""

# ZFS file cache (ARC) limit in GiB, or auto (a quarter of RAM, 1-8 GiB).
ARC_MAX_GB="auto"

# Apply FreeBSD base-system security patches during setup.
RUN_FREEBSD_UPDATE="yes"
