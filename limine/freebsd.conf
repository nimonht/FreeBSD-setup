# Limine menu entry for FreeBSD.
#
# Append this block to the END of your existing limine.conf from CachyOS
# (usually /boot/limine.conf - check with:  sudo find /boot -name limine.conf).
# Leave every existing line as it is. Indentation is 4 spaces.
#
# Limine does not load the FreeBSD kernel itself: it starts FreeBSD's own
# loader (loader.efi), which zfs-install.sh copied to the EFI System
# Partition. loader.efi then boots the ZFS pool and shows the FreeBSD menu
# (boot environments, single user mode, ...).

/FreeBSD
    comment: FreeBSD 15 on ZFS
    protocol: efi
    path: boot():/EFI/freebsd/loader.efi

# "boot():" means "the partition this limine.conf is on". That is correct when
# limine.conf lives on the EFI System Partition (the CachyOS default, where the
# ESP is mounted at /boot).
#
# If your limine.conf is NOT on the ESP, point at the ESP by its partition
# UUID instead. Get it in CachyOS with:
#     lsblk -o NAME,FSTYPE,PARTUUID,MOUNTPOINTS | grep -i vfat
# and use:
#     path: guid(xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx):/EFI/freebsd/loader.efi
